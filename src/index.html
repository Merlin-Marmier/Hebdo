<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>eikon parcel starter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/main.scss" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="section">
      <h2>Primary</h2>

      <div class="row">
        <button type="button" class="btn btn--primary">Label</button>
        <a href="#" class="btn btn--primary">Label</a>
        <button type="button" class="btn btn--primary" disabled>Label</button>
        <a href="#" class="btn btn--primary" aria-disabled="true" tabindex="-1"
          >Label</a
        >
      </div>

      <div class="row">
        <button type="button" class="btn btn--primary btn--small">Label</button>
        <a href="#" class="btn btn--primary btn--small">Label</a>
        <button type="button" class="btn btn--primary btn--small" disabled>
          Label
        </button>
        <a
          href="#"
          class="btn btn--primary btn--small"
          aria-disabled="true"
          tabindex="-1"
          >Label</a
        >
      </div>
    </section>

    <section class="section section--dark">
      <h2>Secondary</h2>

      <div class="row">
        <button type="button" class="btn btn--secondary">Label</button>
        <a href="#" class="btn btn--secondary">Label</a>
        <button type="button" class="btn btn--secondary" disabled>Label</button>
        <a
          href="#"
          class="btn btn--secondary"
          aria-disabled="true"
          tabindex="-1"
          >Label</a
        >
      </div>

      <div class="row">
        <button type="button" class="btn btn--secondary btn--small">
          Label
        </button>
        <a href="#" class="btn btn--secondary btn--small">Label</a>
        <button type="button" class="btn btn--secondary btn--small" disabled>
          Label
        </button>
        <a
          href="#"
          class="btn btn--secondary btn--small"
          aria-disabled="true"
          tabindex="-1"
          >Label</a
        >
      </div>
    </section>

    <script src="js/main.js" type="module"></script>
  </body>
</html>
